[project]
name = "pipeline"
version = "0.1.0"
description = "Automated spike sorting pipeline for OpenEphys recordings using Kilosort4 and SpikeInterface"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Senzai Lab" }
]

dependencies = [
    "numpy>=2.3",
    "pyyaml>=6.0",
    "loguru>=0.7.0",
    "spikeinterface[full]>=0.101.0",
    "probeinterface>=0.2.21",
    "pynapple>=0.9.0",
    "kilosort>=4.1.7",
    "jupyter>=1.1.1",
    "ipywidgets>=8.1.8",
    "open-ephys-python-tools>=1.0.1",
]

[project.optional-dependencies]
full = [
    "kilosort>=4.0.30",
    "torch>=2.0",
]

[project.scripts]
pipeline-run = "pipeline.run_script:main"
pipeline-gen_xml = "pipeline.xml_script:main"
gen_xml = "pipeline.gen_xml:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
